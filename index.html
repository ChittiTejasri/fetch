<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Store</title>
    <style>
       
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }
        .header {
            background-color:cadetblue;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 18px;
        }
        h2 {
            text-align: center;
            color: #263445;
            padding: 35px 0;
            font-size: 28px;
        }
        #ShowBtn {
            width: 100%;
            padding: 15px;
            background-color: rgb(132, 220, 132);
            color: black;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #ShowBtn:hover {
            background-color: rgb(126, 232, 126);
        }
        #output {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }
        .card {
            width: calc(25% - 20px);
            min-width: 220px;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }
        .card img {
            width: 100%;
            height: 230px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .card h3 {
            font-size: 18px;
            color: #263445;
            min-height: 55px;
            margin-bottom: 15px;
        }
        .category {
            color: gray;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .price {
            color: #219653;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .rating {
            color: #d6a329;
            font-size: 17px;
            margin-bottom: 20px;
        }

        .buy-btn {
            width: 100%;
            padding: 14px;
            background-color: #ff9800;
            color: #222;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            background-color: #e68900;
        }
        @media (max-width: 900px) {
            .card {
                width: calc(50% - 20px);
            }
        }
        @media (max-width: 550px) {
            .header h1 {
                font-size: 27px;
            }

            .card {
                width: 100%;
            }

            #output {
                padding: 15px;
            }
        }
</style>
</head>
<body>
    <div class="header">
        <h1>My Shopping Store</h1>
        <p>Explore Our Latest Products</p>
    </div>

    <h2>All Products</h2>

    <button id="ShowBtn">Show Products</button>

    <div id="output"></div>

    <script src="fetchEX.js"></script>
</body>
</html>
